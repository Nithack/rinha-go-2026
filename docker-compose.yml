services:
  lb:
    image: nginx:1.29-alpine
    container_name: rinha-lb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "16MB"

  api1:
    image: nithack/rinha-2026-api:latest
    container_name: rinha-api-1
    depends_on:
      - vector-engine
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "32MB"

  api2:
    image: nithack/rinha-2026-api:latest
    container_name: rinha-api-2
    depends_on:
      - vector-engine
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "32MB"

  vector-engine:
    image: nithack/rinha-2026-vector-engine:latest
    container_name: rinha-vector-engine
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: "270MB"
